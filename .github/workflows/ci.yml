name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Build, check, and test
        run: |
          npm ci
          npm run build
          npm run check
          npm test

      - name: Built output is committed
        run: git diff --exit-code main.js
